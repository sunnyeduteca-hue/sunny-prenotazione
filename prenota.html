<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prenota - Sunny on the Rainbow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fff8f0;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container { max-width: 520px; margin: 0 auto; }
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .header .emoji { font-size: 52px; }
    .header h1 { font-size: 26px; color: #ff7043; margin: 8px 0 4px; }
    .header p { color: #888; font-size: 15px; }
    .card {
      background: white;
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 4px 20px rgba(255,112,67,0.1);
    }
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select, textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #ffe0cc;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      background: #fff8f0;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: #ff7043; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #ff7043;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    .submit-btn:hover { background: #e64a19; }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
    #success-msg {
      display: none;
      text-align: center;
      padding: 32px 20px;
    }
    #success-msg .icon { font-size: 64px; }
    #success-msg h2 { font-size: 22px; color: #ff7043; margin: 12px 0 8px; }
    #success-msg p { color: #666; font-size: 15px; line-height: 1.6; }
    #error-msg {
      display: none;
      background: #fff0f0;
      border: 1px solid #ffcccc;
      color: #cc0000;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-top: 12px;
      text-align: center;
    }
    .slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .slot-btn {
      padding: 10px 6px;
      border: 1.5px solid #ffe0cc;
      border-radius: 8px;
      background: #fff8f0;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
      transition: all 0.15s;
      color: #555;
    }
    .slot-btn:hover { border-color: #ff7043; color: #ff7043; }
    .slot-btn.selected { background: #ff7043; color: white; border-color: #ff7043; }
    .slot-label { font-size: 11px; opacity: 0.8; display: block; margin-top: 2px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="emoji">🎂</div>
    <h1>Prenota la tua festa</h1>
    <p>Compila il modulo e ti contattiamo per confermare</p>
  </div>

  <div class="card">
    <div id="form-area">
      <!-- Dati personali -->
      <div class="row">
        <div class="form-group">
          <label>👤 Nome *</label>
          <input type="text" id="nome" placeholder="Il tuo nome" required>
        </div>
        <div class="form-group">
          <label>📞 Telefono *</label>
          <input type="tel" id="telefono" placeholder="339 123 4567" required>
        </div>
      </div>

      <div class="form-group">
        <label>📧 Email</label>
        <input type="email" id="email" placeholder="tua@email.it">
      </div>

      <!-- Data -->
      <div class="form-group">
        <label>📅 Data della festa *</label>
        <input type="date" id="data_evento" required>
      </div>

      <!-- Slot orario -->
      <div class="form-group">
        <label>🕐 Orario *</label>
        <div class="slots">
          <div class="slot-btn" onclick="selectSlot(this, 'mattino')">
            🌅 Mattino
            <span class="slot-label">10:00–13:00</span>
          </div>
          <div class="slot-btn" onclick="selectSlot(this, 'pomeriggio')">
            ☀️ Pomeriggio
            <span class="slot-label">16:30–19:00</span>
          </div>
          <div class="slot-btn" onclick="selectSlot(this, 'sera')">
            🌙 Sera
            <span class="slot-label">19:00–22:00</span>
          </div>
        </div>
        <input type="hidden" id="orario">
      </div>

      <!-- Partecipanti -->
      <div class="form-group">
        <label>👥 Numero partecipanti *</label>
        <select id="partecipanti">
          <option value="">Seleziona...</option>
          <option value="fino a 10">Fino a 10</option>
          <option value="10-20">10–20 persone</option>
          <option value="20-30">20–30 persone</option>
          <option value="30-50">30–50 persone</option>
          <option value="oltre 50">Oltre 50 persone</option>
        </select>
      </div>

      <!-- Note -->
      <div class="form-group">
        <label>📝 Note o richieste speciali</label>
        <textarea id="note" rows="3" placeholder="Tema della festa, allergie, richieste speciali..."></textarea>
      </div>

      <button class="submit-btn" onclick="submitBooking()" id="submit-btn">
        🎉 Invia richiesta
      </button>
      <div id="error-msg"></div>
    </div>

    <!-- Successo -->
    <div id="success-msg">
      <div class="icon">🎊</div>
      <h2>Richiesta inviata!</h2>
      <p>Grazie <strong id="success-name"></strong>!<br>
      Abbiamo ricevuto la tua richiesta per il <strong id="success-date"></strong>.<br><br>
      Ti contatteremo presto per confermare la prenotazione. 🌈</p>
    </div>
  </div>
</div>

<script>
  const WEBHOOK_URL = 'https://sunnyeduteca.app.n8n.cloud/webhook/prenotazione-compleanno';

  // Imposta data minima = oggi
  document.getElementById('data_evento').min = new Date().toISOString().split('T')[0];

  let selectedSlot = '';

  function selectSlot(el, slot) {
    document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    selectedSlot = slot;
    document.getElementById('orario').value = slot;
  }

  async function submitBooking() {
    const nome        = document.getElementById('nome').value.trim();
    const telefono    = document.getElementById('telefono').value.trim();
    const email       = document.getElementById('email').value.trim();
    const data_evento = document.getElementById('data_evento').value;
    const partecipanti = document.getElementById('partecipanti').value;
    const note        = document.getElementById('note').value.trim();

    // Validazione
    if (!nome || !telefono || !data_evento || !selectedSlot || !partecipanti) {
      showError('Compila tutti i campi obbligatori (*)');
      return;
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Invio in corso...';
    document.getElementById('error-msg').style.display = 'none';

    // Session ID stabile per l'utente
    let sessionId = localStorage.getItem('sunny_session') || ('sess_' + Math.random().toString(36).substr(2,9));
    localStorage.setItem('sunny_session', sessionId);
    localStorage.setItem('sunny_name', nome);
    if (email) localStorage.setItem('sunny_email', email);

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tipo_richiesta:      'prenotazione',
          nome:                nome,
          email:               email,
          telefono:            telefono,
          data_compleanno:     data_evento,
          orario:              selectedSlot,
          numero_partecipanti: partecipanti,
          note:                note
        })
      });

      if (!response.ok) throw new Error('HTTP ' + response.status);

      // Mostra successo
      document.getElementById('form-area').style.display = 'none';
      document.getElementById('success-name').textContent = nome;
      document.getElementById('success-date').textContent = formatDate(data_evento);
      document.getElementById('success-msg').style.display = 'block';

    } catch (err) {
      showError('Errore di connessione. Riprova o contattaci direttamente!');
      btn.disabled = false;
      btn.textContent = '🎉 Invia richiesta';
      console.error(err);
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = '⚠️ ' + msg;
    el.style.display = 'block';
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
</script>
</body>
</html>
