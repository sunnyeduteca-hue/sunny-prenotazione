<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Operatore · Sunny on the Rainbow</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0F1A;--sf:#1A1A2E;--sf2:#16213E;--bd:rgba(255,255,255,.08);--coral:#FF6B6B;--sun:#FFB800;--mint:#4ECDC4;--sky:#45B7D1;--pu:#A855F7;--gr:#22C55E;--txt:#F0F0FF;--mt:rgba(240,240,255,.45);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--coral),var(--sun));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hsub{font-size:12px;color:var(--mt);margin-top:2px;}
.hr{display:flex;align-items:center;gap:12px;}
.rbtn{background:rgba(255,255,255,.06);border:1px solid var(--bd);color:var(--txt);padding:8px 16px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:all .2s;}
.rbtn:hover{background:rgba(255,255,255,.12);}
.lupd{font-size:12px;color:var(--mt);}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 57px);}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.sb{background:var(--sf);border-right:1px solid var(--bd);padding:20px;overflow-y:auto;}
.sbt{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;}
.stcard{background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.stlbl{font-size:11px;color:var(--mt);font-weight:500;text-transform:uppercase;letter-spacing:.5px;}
.stval{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;margin:4px 0 0;line-height:1;}
.stsub{font-size:12px;color:var(--mt);margin-top:2px;}
.fg{margin-bottom:16px;}
.fl{font-size:12px;color:var(--mt);font-weight:600;margin-bottom:6px;display:block;}
.fs,.fi{width:100%;background:var(--sf2);border:1px solid var(--bd);color:var(--txt);padding:10px 12px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;}
.fs:focus,.fi:focus{border-color:var(--mint);}
.fi::placeholder{color:var(--mt);}
.main{padding:24px;overflow-y:auto;}
.tabs{display:flex;gap:4px;background:var(--sf);padding:4px;border-radius:12px;margin-bottom:24px;width:fit-content;}
.tab{padding:8px 18px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--mt);transition:all .2s;border:none;background:none;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:6px;}
.tab.active{background:var(--coral);color:#fff;}
.tab:hover:not(.active){color:var(--txt);background:rgba(255,255,255,.06);}
.nbadge{background:var(--coral);color:#fff;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;}

/* LISTA */
.pgrid{display:grid;gap:12px;}
.pc{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;transition:border-color .2s,transform .15s;cursor:pointer;}
.pc:hover{border-color:rgba(255,255,255,.16);transform:translateY(-1px);}
.pc.exp{border-color:var(--mint);}
.pico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.pico.c{background:rgba(255,107,107,.15);}
.pico.z{background:rgba(255,184,0,.15);}
.pico.e{background:rgba(168,85,247,.15);}
.pico.g{background:rgba(78,205,196,.15);}
.pmain{min-width:0;}
.pnome{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pmeta{font-size:12px;color:var(--mt);margin-top:3px;}
.pmeta strong{color:var(--txt);}
.pr{text-align:right;flex-shrink:0;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;}
.badge.att{background:rgba(255,184,0,.15);color:var(--sun);}
.badge.conf{background:rgba(34,197,94,.15);color:var(--gr);}
.badge.ann{background:rgba(255,107,107,.15);color:var(--coral);}
.pdet{display:none;grid-column:1/-1;background:var(--sf2);border-radius:10px;padding:14px;margin-top:4px;}
.pc.exp .pdet{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:600px){.pc.exp .pdet{grid-template-columns:1fr}}
.dr{font-size:13px;}
.dr .dk{color:var(--mt);font-weight:500;}
.dr .dv{color:var(--txt);font-weight:600;}
.dact{display:flex;gap:8px;margin-top:12px;grid-column:1/-1;flex-wrap:wrap;}
.ab{padding:8px 14px;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .2s;text-decoration:none;display:inline-flex;align-items:center;}
.ab:hover{opacity:.85;}
.ab.ok{background:var(--gr);color:#fff;}
.ab.no{background:var(--coral);color:#fff;}
.ab.tel{background:var(--sky);color:#fff;}
.ab.ml{background:var(--pu);color:#fff;}

/* CALENDARIO */
.calhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.calmth{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;}
.calnb{background:var(--sf);border:1px solid var(--bd);color:var(--txt);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.calnb:hover{background:rgba(255,255,255,.1);}
.calgv{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cdh{text-align:center;font-size:10px;font-weight:700;color:var(--mt);padding:6px 0;text-transform:uppercase;}
.ccell{min-height:78px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px;cursor:pointer;transition:border-color .2s;}
.ccell:hover{border-color:rgba(255,255,255,.2);}
.ccell.emp{background:transparent;border-color:transparent;cursor:default;}
.ccell.dis{opacity:.3;cursor:not-allowed;}
.ccell.tod{border-color:var(--sun)!important;}
.ccell.sel{border-color:var(--mint)!important;}
.ccd{font-size:13px;font-weight:700;color:var(--mt);margin-bottom:4px;}
.ccell.hev .ccd{color:var(--txt);}
.evd{font-size:10px;background:rgba(255,107,107,.2);color:var(--coral);border-radius:4px;padding:1px 5px;margin-top:2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.evd.z{background:rgba(255,184,0,.2);color:var(--sun);}
.slov{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:20px;}
.slovt{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:12px;color:var(--mt);}
.slrow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);}
.slrow:last-child{border:none;}
.slinfo{font-size:13px;font-weight:600;}
.slbw{flex:1;margin:0 12px;height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;}
.slb{height:100%;border-radius:3px;transition:width .4s ease;}
.slcnt{font-size:12px;color:var(--mt);white-space:nowrap;}

/* === TAB CHAT === */
.chat-layout{display:grid;grid-template-columns:300px 1fr;gap:16px;height:calc(100vh - 150px);}
@media(max-width:900px){.chat-layout{grid-template-columns:1fr;height:auto;}}
.convlist{background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:400px;}
.clhead{padding:14px 16px;border-bottom:1px solid var(--bd);font-family:'Syne',sans-serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:space-between;}
.clsearch{padding:10px 14px;border-bottom:1px solid var(--bd);}
.clsearch input{width:100%;background:var(--sf2);border:1px solid var(--bd);color:var(--txt);padding:8px 12px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;}
.clsearch input:focus{border-color:var(--mint);}
.clitems{flex:1;overflow-y:auto;}
.clitem{padding:12px 16px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .2s;}
.clitem:hover{background:rgba(255,255,255,.04);}
.clitem.act{background:rgba(78,205,196,.08);border-left:3px solid var(--mint);}
.clitop{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;}
.cliname{font-weight:700;font-size:13px;}
.clitime{font-size:11px;color:var(--mt);}
.cliprev{font-size:12px;color:var(--mt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cliunread{background:var(--coral);color:#fff;min-width:18px;height:18px;border-radius:9px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;}

.cpanel{background:var(--sf);border:1px solid var(--bd);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;min-height:400px;}
.cphead{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;flex-shrink:0;}
.cpav{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--coral),#FF8E53);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.cpinfo{flex:1;}
.cpname{font-weight:700;font-size:14px;}
.cpsub{font-size:12px;color:var(--mt);margin-top:2px;}
.cpacts{display:flex;gap:6px;}
.cpbtn{background:rgba(255,255,255,.06);border:1px solid var(--bd);color:var(--txt);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;font-family:'DM Sans',sans-serif;}
.cpbtn:hover{background:rgba(255,255,255,.12);}
.cpmsgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.cpmsgs::-webkit-scrollbar{width:4px}.cpmsgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.cmsg{display:flex;gap:8px;align-items:flex-end;max-width:78%;}
.cmsg.bot{align-self:flex-start;}
.cmsg.usr{align-self:flex-end;flex-direction:row-reverse;}
.cmsg.op{align-self:flex-end;flex-direction:row-reverse;}
.cmsgav{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.cmsg.bot .cmsgav{background:linear-gradient(135deg,var(--coral),#FF8E53);}
.cmsg.usr .cmsgav{background:rgba(78,205,196,.2);}
.cmsg.op .cmsgav{background:var(--pu);}
.cmsgb{padding:10px 14px;border-radius:18px;font-size:13px;line-height:1.5;word-break:break-word;}
.cmsg.bot .cmsgb{background:rgba(255,255,255,.08);color:var(--txt);border-bottom-left-radius:4px;}
.cmsg.usr .cmsgb{background:rgba(78,205,196,.12);color:var(--txt);border-bottom-right-radius:4px;}
.cmsg.op .cmsgb{background:rgba(168,85,247,.2);color:var(--txt);border-bottom-right-radius:4px;}
.cmsglbl{font-size:10px;font-weight:700;color:var(--pu);margin-bottom:3px;text-align:right;}
.cpbar{padding:14px 16px;border-top:1px solid var(--bd);display:flex;gap:10px;align-items:flex-end;flex-shrink:0;}
.cpinp{flex:1;background:var(--sf2);border:1px solid var(--bd);color:var(--txt);padding:10px 14px;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;resize:none;max-height:100px;overflow-y:auto;transition:border-color .2s;}
.cpinp:focus{border-color:var(--mint);}
.cpinp::placeholder{color:var(--mt);}
.cpsnd{background:var(--coral);border:none;color:#fff;width:42px;height:42px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:opacity .2s;}
.cpsnd:hover{opacity:.85;}
.cpsnd:disabled{opacity:.4;cursor:not-allowed;}
.cpempty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--mt);}
.cpempty .ico{font-size:44px;}

.empty{text-align:center;padding:60px 20px;color:var(--mt);}
.empty .ico{font-size:48px;margin-bottom:12px;display:block;}
.ldg{text-align:center;padding:40px;color:var(--mt);}
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--coral);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px;}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--gr);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;font-size:14px;transform:translateY(80px);opacity:0;transition:all .3s;z-index:999;}
.toast.on{transform:translateY(0);opacity:1;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<header>
  <div><div class="logo">🌈 Sunny on the Rainbow</div><div class="hsub">Dashboard Operatore</div></div>
  <div class="hr"><div class="lupd" id="lupd">—</div><button class="rbtn" onclick="loadData()">↻ Aggiorna</button></div>
</header>

<div class="layout">
  <div class="sb">
    <div class="sbt">Statistiche</div>
    <div class="stcard"><div class="stlbl">Totale</div><div class="stval" id="stTot">—</div><div class="stsub">prenotazioni</div></div>
    <div class="stcard"><div class="stlbl">Questo mese</div><div class="stval" id="stMese" style="color:var(--coral)">—</div><div class="stsub" id="stMeseLbl">—</div></div>
    <div class="stcard"><div class="stlbl">Prossimi 7 gg</div><div class="stval" id="stSett" style="color:var(--mint)">—</div><div class="stsub">in programma</div></div>
    <div class="stcard"><div class="stlbl">In attesa</div><div class="stval" id="stAtt" style="color:var(--sun)">—</div><div class="stsub">da confermare</div></div>
    <div style="height:14px"></div>
    <div class="sbt">Filtri</div>
    <div class="fg"><label class="fl">Stato</label><select class="fs" id="fSt" onchange="applyF()"><option value="">Tutti</option><option value="in_attesa">In attesa</option><option value="confermata">Confermata</option><option value="annullata">Annullata</option></select></div>
    <div class="fg"><label class="fl">Tipo</label><select class="fs" id="fTp" onchange="applyF()"><option value="">Tutti</option><option value="festa_compleanno">🎂 Compleanno</option><option value="pizzata">🍕 Pizzata</option><option value="evento_privato">🎊 Evento</option><option value="pacchetto_gioco">🎠 Gioco</option></select></div>
    <div class="fg"><label class="fl">Cerca</label><input class="fi" id="fNm" placeholder="Nome…" oninput="applyF()"></div>
    <div class="fg"><label class="fl">Mese</label><select class="fs" id="fMs" onchange="applyF()"><option value="">Tutti</option></select></div>
  </div>

  <div class="main">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('lista',this)">📋 Lista</button>
      <button class="tab" onclick="switchTab('cal',this)">📅 Calendario</button>
      <button class="tab" onclick="switchTab('chat',this)" id="tabChat">💬 Chat <span class="nbadge" id="chatBadge" style="display:none">0</span></button>
    </div>

    <div id="tLista"><div class="ldg"><div class="spin"></div>Caricamento…</div></div>
    <div id="tCal" style="display:none">
      <div class="calhdr">
        <button class="calnb" onclick="dPrev()">←</button>
        <div class="calmth" id="dCalMth"></div>
        <button class="calnb" onclick="dNext()">→</button>
      </div>
      <div class="calgv" id="dCalG"></div>
      <div id="dayDet" style="display:none;margin-top:20px">
        <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:12px;color:var(--mt)" id="dayDetT"></div>
        <div id="dayDetC"></div>
      </div>
    </div>
    <div id="tChat" style="display:none">
      <div class="chat-layout">
        <div class="convlist">
          <div class="clhead"><span>💬 Conversazioni</span><span id="convCnt" style="font-size:12px;color:var(--mt)">0</span></div>
          <div class="clsearch"><input id="clsInp" placeholder="🔍 Cerca…" oninput="filterConvs()"></div>
          <div class="clitems" id="clItems"><div style="padding:20px;text-align:center;color:var(--mt);font-size:13px">Caricamento…</div></div>
        </div>
        <div class="cpanel">
          <div class="cpempty" id="cpEmpty"><div class="ico">💬</div><div style="font-size:14px;font-weight:600">Seleziona una conversazione</div></div>
          <div id="cpContent" style="display:none;flex-direction:column;flex:1;overflow:hidden">
            <div class="cphead">
              <div class="cpav" id="cpAv">👤</div>
              <div class="cpinfo"><div class="cpname" id="cpName">—</div><div class="cpsub" id="cpSub">—</div></div>
              <div class="cpacts">
                <button class="cpbtn" id="cpCallBtn" onclick="callClient()">📞</button>
                <button class="cpbtn" onclick="loadConvs()">↻</button>
              </div>
            </div>
            <div class="cpmsgs" id="cpMsgs"></div>
            <div class="cpbar">
              <textarea class="cpinp" id="cpInp" placeholder="Rispondi come operatore…" rows="1" onkeydown="cpKey(event)" oninput="cpResize(this)"></textarea>
              <button class="cpsnd" id="cpSnd" onclick="sendOp()">➤</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const CFG={
  WH:'https://sunnyeduteca.app.n8n.cloud/webhook',
  SLOTS:{mattino:{nm:'Mattino',em:'🌅',or:'10:00–13:00'},pomeriggio:{nm:'Pomeriggio',em:'☀️',or:'16:30–19:00'},sera:{nm:'Sera',em:'🌙',or:'19:00–22:00'}},
  TICO:{festa_compleanno:'🎂',pizzata:'🍕',evento_privato:'🎊',pacchetto_gioco:'🎠',prenotazione:'🎂'},
  MESI:['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'],
  APERTI:[0,3,4,5,6]
};
let allP=[],filtP=[],allC=[],filtC=[],dY=new Date().getFullYear(),dM=new Date().getMonth(),curTab='lista',curConv=null;

async function loadData(){
  try{
    const r=await fetch(`${CFG.WH}/get-prenotazioni`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'list'})});
    const d=await r.json();allP=norm(d);
    document.getElementById('lupd').textContent='Aggiornato: '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    updStats();updMese();applyF();if(curTab==='cal')renderDCal();
    showT('✅ Dati aggiornati');
  }catch(e){document.getElementById('tLista').innerHTML='<div class="empty"><span class="ico">⚠️</span><p>Errore caricamento</p></div>';}
}

function norm(data){
  let a=Array.isArray(data)?data:[];
  if(!Array.isArray(data)&&data&&typeof data==='object'){a=data.prenotazioni||data.data||Object.values(data);if(!Array.isArray(a))a=[data];}
  return a.map((p,i)=>({id:p.id||i,nome:p.nome_cliente||p.nome||p.Nome||'—',email:p.email_cliente||p.email||p.Email||'',telefono:p.telefono||p.Telefono||'',data:p.data_compleanno||p.data||p.Data||'',orario:p.orario||p.Orario||'',tipo:p.tipo_evento||p.tipo||p.tipo_richiesta||'festa_compleanno',partecipanti:p.numero_partecipanti||p.partecipanti||'',stato:(p.stato||p.Stato||'in_attesa').toLowerCase().replace(' ','_'),note:p.note||p.Note||'',festeggiato:p.nome_festeggiato||'',ts:p.Timestamp||p.timestamp||''}));
}

function updStats(){
  const now=new Date(),mc=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`,in7=new Date(now.getTime()+7*86400000);
  document.getElementById('stTot').textContent=allP.length;
  document.getElementById('stMese').textContent=allP.filter(p=>p.data&&p.data.startsWith(mc)).length;
  document.getElementById('stMeseLbl').textContent=CFG.MESI[now.getMonth()];
  document.getElementById('stSett').textContent=allP.filter(p=>{if(!p.data)return false;const d=new Date(p.data+'T12:00:00');return d>=now&&d<=in7;}).length;
  document.getElementById('stAtt').textContent=allP.filter(p=>p.stato==='in_attesa').length;
}

function updMese(){
  const mesi=[...new Set(allP.map(p=>p.data?p.data.substr(0,7):'').filter(Boolean))].sort();
  const sel=document.getElementById('fMs');const cv=sel.value;sel.innerHTML='<option value="">Tutti</option>';
  mesi.forEach(m=>{const[y,mo]=m.split('-');const o=document.createElement('option');o.value=m;o.textContent=`${CFG.MESI[parseInt(mo)-1]} ${y}`;sel.appendChild(o);});sel.value=cv;
}

function applyF(){
  const st=document.getElementById('fSt').value,tp=document.getElementById('fTp').value,nm=document.getElementById('fNm').value.toLowerCase(),ms=document.getElementById('fMs').value;
  filtP=allP.filter(p=>{if(st&&p.stato!==st)return false;if(tp&&p.tipo!==tp)return false;if(nm&&!p.nome.toLowerCase().includes(nm))return false;if(ms&&!(p.data||'').startsWith(ms))return false;return true;}).sort((a,b)=>a.data>b.data?-1:1);
  renderLista();
}

function renderLista(){
  const c=document.getElementById('tLista');
  if(!filtP.length){c.innerHTML='<div class="empty"><span class="ico">📭</span><p>Nessuna prenotazione trovata.</p></div>';return;}
  c.innerHTML='<div class="pgrid" id="pG"></div>';const g=document.getElementById('pG');
  filtP.forEach((p,i)=>{
    const sl=CFG.SLOTS[p.orario]||{nm:p.orario||'—',em:'⏰'};
    const ic=CFG.TICO[p.tipo]||'🎪';
    const tc=p.tipo==='pizzata'?'z':p.tipo==='evento_privato'?'e':p.tipo==='pacchetto_gioco'?'g':'c';
    const df=p.data?new Date(p.data+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'}):'—';
    const sc=p.stato==='confermata'?'conf':p.stato==='annullata'?'ann':'att';
    const card=document.createElement('div');card.className='pc';
    card.innerHTML=`<div class="pico ${tc}">${ic}</div><div class="pmain"><div class="pnome">${p.nome}</div><div class="pmeta"><strong>${df}</strong> · ${sl.em} ${sl.nm}${p.partecipanti?` · 👥 ${p.partecipanti}`:''}</div>${p.telefono?`<div class="pmeta">📞 ${p.telefono}</div>`:''}</div><div class="pr"><span class="badge ${sc}">${p.stato.replace('_',' ')}</span></div><div class="pdet"><div class="dr"><span class="dk">Tipo</span><br><span class="dv">${ic} ${p.tipo.replace('_',' ')}</span></div><div class="dr"><span class="dk">Data</span><br><span class="dv">${df}</span></div><div class="dr"><span class="dk">Orario</span><br><span class="dv">${sl.em} ${sl.nm} ${sl.or||''}</span></div><div class="dr"><span class="dk">Partecipanti</span><br><span class="dv">${p.partecipanti||'—'}</span></div>${p.festeggiato?`<div class="dr"><span class="dk">Festeggiato</span><br><span class="dv">${p.festeggiato}</span></div>`:''} ${p.note?`<div class="dr" style="grid-column:1/-1"><span class="dk">Note</span><br><span class="dv">${p.note}</span></div>`:''}<div class="dact">${p.stato!=='confermata'?`<button class="ab ok" onclick="chSt(${i},'confermata',event)">✅ Conferma</button>`:''}${p.stato!=='annullata'?`<button class="ab no" onclick="chSt(${i},'annullata',event)">❌ Annulla</button>`:''}${p.telefono?`<a href="tel:${p.telefono}" class="ab tel" onclick="event.stopPropagation()">📞 Chiama</a>`:''}${p.email?`<a href="mailto:${p.email}" class="ab ml" onclick="event.stopPropagation()">✉️ Email</a>`:''}</div></div>`;
    card.onclick=(e)=>{if(e.target.closest('.ab,a'))return;card.classList.toggle('exp');};
    g.appendChild(card);
  });
}

function chSt(i,st,e){e.stopPropagation();filtP[i].stato=st;const mi=allP.findIndex(a=>a.id===filtP[i].id);if(mi!==-1)allP[mi].stato=st;updStats();renderLista();showT('Stato: '+st);}

/* CALENDARIO */
const GDN=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
function renderDCal(){
  document.getElementById('dCalMth').textContent=CFG.MESI[dM]+' '+dY;
  const g=document.getElementById('dCalG');g.innerHTML='';
  GDN.forEach(n=>{const e=document.createElement('div');e.className='cdh';e.textContent=n;g.appendChild(e);});
  const fd=new Date(dY,dM,1).getDay(),nd=new Date(dY,dM+1,0).getDate();
  const today=new Date();today.setHours(0,0,0,0);
  for(let i=0;i<fd;i++){const e=document.createElement('div');e.className='ccell emp';g.appendChild(e);}
  for(let d=1;d<=nd;d++){
    const ds=`${dY}-${String(dM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const date=new Date(dY,dM,d),dp=allP.filter(p=>p.data===ds);
    const isO=CFG.APERTI.includes(date.getDay()),isT=date.getTime()===today.getTime();
    const el=document.createElement('div');
    el.className=`ccell${!isO?' dis':''}${isT?' tod':''}${dp.length?' hev':''}`;
    let dots='';if(dp.length){const byS={};dp.forEach(p=>{if(!byS[p.orario])byS[p.orario]=0;byS[p.orario]++;});Object.entries(byS).forEach(([s,c])=>{const sl=CFG.SLOTS[s]||{em:'🎪'};dots+=`<div class="evd ${s==='pizzata'?'z':''}">${sl.em} ${c}</div>`;});}
    el.innerHTML=`<div class="ccd">${d}</div>${dots}`;
    if(isO)el.onclick=()=>showDayDet(ds,dp,el);
    g.appendChild(el);
  }
}

function showDayDet(ds,dp,el){
  document.querySelectorAll('.ccell.sel').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');
  const det=document.getElementById('dayDet');det.style.display='block';
  const df=new Date(ds+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('dayDetT').textContent=`📅 ${df}`;
  let h='<div class="slov"><div class="slovt">Slot disponibilità</div>';
  Object.entries(CFG.SLOTS).forEach(([id,s])=>{const oc=dp.filter(p=>p.orario===id).length;const pc=Math.round(oc/3*100);const cl=oc>=3?'#FF6B6B':oc>=2?'#FFB800':'#22C55E';h+=`<div class="slrow"><span class="slinfo">${s.em} ${s.nm}</span><div class="slbw"><div class="slb" style="width:${pc}%;background:${cl}"></div></div><span class="slcnt">${oc}/3</span></div>`;});
  h+='</div>';
  if(!dp.length)h+='<div class="empty"><span class="ico">📭</span><p>Nessuna prenotazione</p></div>';
  else{h+='<div class="pgrid">';dp.forEach(p=>{const sl=CFG.SLOTS[p.orario]||{em:'⏰',nm:p.orario};const sc=p.stato==='confermata'?'conf':p.stato==='annullata'?'ann':'att';h+=`<div class="pc" style="grid-template-columns:auto 1fr auto"><div class="pico c">${CFG.TICO[p.tipo]||'🎪'}</div><div class="pmain"><div class="pnome">${p.nome}</div><div class="pmeta">${sl.em} ${sl.nm}${p.partecipanti?` · 👥 ${p.partecipanti}`:''}</div>${p.telefono?`<div class="pmeta">📞 ${p.telefono}</div>`:''}</div><div class="pr"><span class="badge ${sc}">${p.stato.replace('_',' ')}</span></div></div>`;});h+='</div>';}
  document.getElementById('dayDetC').innerHTML=h;
}
function dPrev(){if(dM===0){dM=11;dY--;}else dM--;renderDCal();}
function dNext(){if(dM===11){dM=0;dY++;}else dM++;renderDCal();}

/* === CHAT === */
async function loadConvs(){
  document.getElementById('clItems').innerHTML='<div style="padding:20px;text-align:center;color:var(--mt);font-size:13px">Caricamento…</div>';
  try{
    const r=await fetch(`${CFG.WH}/get-prenotazioni`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'conversations'})});
    const d=await r.json();
    const raw=Array.isArray(d)?d:(d.conversazioni||d.data||[]);
    // Raggruppa per session_id
    const grps={};
    raw.forEach(row=>{
      const sid=row['Customer ID']||row.session_id||row['Email Cliente']||('s_'+Math.random().toString(36).substr(2,6));
      if(!grps[sid])grps[sid]={sid,nome:row['Email Cliente']||row.Nome||sid,email:row['Email Cliente']||'',tel:'',msgs:[],lastT:''};
      if(row['Messaggio Cliente'])grps[sid].msgs.push({role:'usr',txt:row['Messaggio Cliente'],t:row.Timestamp||''});
      if(row['Risposta AI'])grps[sid].msgs.push({role:'bot',txt:row['Risposta AI'],t:row.Timestamp||''});
      if(row.Timestamp>grps[sid].lastT)grps[sid].lastT=row.Timestamp;
    });
    allC=Object.values(grps).sort((a,b)=>b.lastT.localeCompare(a.lastT));
    filtC=[...allC];
    renderConvList();
    document.getElementById('convCnt').textContent=allC.length;
    if(allC.length>0){document.getElementById('chatBadge').style.display='inline-flex';document.getElementById('chatBadge').textContent=allC.length;}
  }catch(e){document.getElementById('clItems').innerHTML='<div style="padding:20px;text-align:center;color:var(--mt);font-size:13px">Errore caricamento chat</div>';}
}

function renderConvList(){
  const c=document.getElementById('clItems');
  if(!filtC.length){c.innerHTML='<div style="padding:20px;text-align:center;color:var(--mt);font-size:13px">Nessuna conversazione</div>';return;}
  c.innerHTML='';
  filtC.forEach(cv=>{
    const last=cv.msgs[cv.msgs.length-1];
    const prev=last?(last.txt.substring(0,45)+(last.txt.length>45?'…':'')):'';
    const tf=cv.lastT?new Date(cv.lastT).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'';
    const div=document.createElement('div');
    div.className='clitem'+(curConv&&curConv.sid===cv.sid?' act':'');
    div.innerHTML=`<div class="clitop"><span class="cliname">${cv.nome}</span><span class="clitime">${tf}</span></div><div class="cliprev">${prev}</div>`;
    div.onclick=()=>openConv(cv);
    c.appendChild(div);
  });
}

function filterConvs(){
  const q=document.getElementById('clsInp').value.toLowerCase();
  filtC=q?allC.filter(c=>c.nome.toLowerCase().includes(q)||c.sid.toLowerCase().includes(q)):allC;
  renderConvList();
}

function openConv(cv){
  curConv=cv;renderConvList();
  document.getElementById('cpEmpty').style.display='none';
  const cc=document.getElementById('cpContent');cc.style.display='flex';
  document.getElementById('cpAv').textContent=cv.nome?cv.nome[0].toUpperCase():'👤';
  document.getElementById('cpName').textContent=cv.nome;
  document.getElementById('cpSub').textContent=`${cv.msgs.length} messaggi${cv.email?' · '+cv.email:''}`;
  document.getElementById('cpCallBtn').dataset.tel=cv.tel||'';
  renderMsgs(cv);
}

function renderMsgs(cv){
  const m=document.getElementById('cpMsgs');m.innerHTML='';
  cv.msgs.forEach(msg=>{
    const div=document.createElement('div');div.className='cmsg '+msg.role;
    const av=msg.role==='bot'?'🌈':msg.role==='op'?'👨‍💼':'👤';
    const lbl=msg.role==='op'?'<div class="cmsglbl">Operatore</div>':'';
    div.innerHTML=`${lbl}<div class="cmsgav">${av}</div><div class="cmsgb">${msg.txt}</div>`;
    m.appendChild(div);
  });
  m.scrollTop=m.scrollHeight;
}

async function sendOp(){
  const inp=document.getElementById('cpInp');const txt=inp.value.trim();
  if(!txt||!curConv)return;
  inp.value='';inp.style.height='';document.getElementById('cpSnd').disabled=true;
  curConv.msgs.push({role:'op',txt,t:new Date().toISOString()});
  renderMsgs(curConv);
  try{
    await fetch(`${CFG.WH}/sunny-chat`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:txt,session_id:curConv.sid,name:'Operatore',is_operator:true})});
    showT('✅ Messaggio inviato');
  }catch(e){showT('⚠️ Errore invio');}
  document.getElementById('cpSnd').disabled=false;
}

function callClient(){const t=document.getElementById('cpCallBtn').dataset.tel;if(t)window.open('tel:'+t);else showT('⚠️ Nessun telefono disponibile');}
function cpKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendOp();}}
function cpResize(el){el.style.height='';el.style.height=Math.min(el.scrollHeight,100)+'px';}

/* TABS */
function switchTab(tab,btn){
  curTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');
  document.getElementById('tLista').style.display=tab==='lista'?'block':'none';
  document.getElementById('tCal').style.display=tab==='cal'?'block':'none';
  document.getElementById('tChat').style.display=tab==='chat'?'block':'none';
  if(tab==='cal')renderDCal();
  if(tab==='chat')loadConvs();
}

function showT(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3000);}

loadData();
setInterval(loadData,120000);
</script>
