<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunny on the Rainbow - Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fff8f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #chat-header {
      background: #ff7043;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    #chat-header .avatar {
      width: 44px; height: 44px;
      background: white;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    #chat-header .info h2 { font-size: 17px; }
    #chat-header .info p { font-size: 13px; opacity: 0.85; }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .msg.bot {
      background: #fff;
      border: 1px solid #ffe0cc;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .msg.user {
      background: #ff7043;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg.system {
      background: #f0f0f0;
      color: #666;
      font-size: 13px;
      align-self: center;
      text-align: center;
      border-radius: 10px;
      padding: 6px 12px;
    }
    .typing {
      display: flex; gap: 5px; align-items: center;
      padding: 10px 14px;
      background: #fff;
      border: 1px solid #ffe0cc;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      width: fit-content;
    }
    .typing span {
      width: 8px; height: 8px;
      background: #ff7043;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }
    #chat-input-area {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid #ffe0cc;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #user-input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #ffccaa;
      border-radius: 24px;
      font-size: 15px;
      outline: none;
      resize: none;
      max-height: 120px;
      line-height: 1.4;
      font-family: inherit;
      background: #fff8f0;
    }
    #user-input:focus { border-color: #ff7043; }
    #send-btn {
      width: 44px; height: 44px;
      background: #ff7043;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #send-btn:hover { background: #e64a19; }
    #send-btn:disabled { background: #ccc; cursor: not-allowed; }
    #name-modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    #name-modal.hidden { display: none; }
    .modal-box {
      background: white;
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 340px;
      width: 90%;
      text-align: center;
    }
    .modal-box h3 { font-size: 20px; margin-bottom: 8px; color: #ff7043; }
    .modal-box p { color: #666; font-size: 14px; margin-bottom: 20px; }
    .modal-box input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #ffccaa;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 10px;
      outline: none;
    }
    .modal-box input:focus { border-color: #ff7043; }
    .modal-box button {
      width: 100%;
      padding: 12px;
      background: #ff7043;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
    }
    .modal-box button:hover { background: #e64a19; }
  </style>
</head>
<body>

<!-- Modal nome -->
<div id="name-modal">
  <div class="modal-box">
    <div style="font-size:48px;margin-bottom:8px">🌈</div>
    <h3>Ciao! Benvenuto</h3>
    <p>Come ti chiami? Così posso aiutarti meglio 😊</p>
    <input type="text" id="name-input" placeholder="Il tuo nome..." maxlength="50">
    <input type="email" id="email-input" placeholder="La tua email (opzionale)" style="margin-top:8px">
    <button onclick="startChat()" style="margin-top:12px">Inizia la chat ✨</button>
  </div>
</div>

<!-- Header -->
<div id="chat-header">
  <div class="avatar">🌈</div>
  <div class="info">
    <h2>Sunny on the Rainbow</h2>
    <p>Assistente virtuale · Di solito risponde subito</p>
  </div>
</div>

<!-- Messaggi -->
<div id="chat-messages"></div>

<!-- Input -->
<div id="chat-input-area">
  <textarea id="user-input" placeholder="Scrivi un messaggio..." rows="1"
    onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button id="send-btn" onclick="sendMessage()">➤</button>
</div>

<script>
  // ── CONFIG ────────────────────────────────────────────────────
  const WEBHOOK_URL = 'https://sunnyeduteca.app.n8n.cloud/webhook/sunny-chat';

  // ── STATO ─────────────────────────────────────────────────────
  let userName  = '';
  let userEmail = '';
  let sessionId = '';

  // ── INIT ──────────────────────────────────────────────────────
  window.onload = () => {
    // Ripristina sessione esistente
    userName  = localStorage.getItem('sunny_name')  || '';
    userEmail = localStorage.getItem('sunny_email') || '';
    sessionId = localStorage.getItem('sunny_session') || generateId();

    if (userName) {
      document.getElementById('name-modal').classList.add('hidden');
      addMessage('bot', '👋 Bentornato ' + userName + '! Come posso aiutarti oggi?');
      focusInput();
    } else {
      document.getElementById('name-input').focus();
    }
  };

  function generateId() {
    return 'sess_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
  }

  function startChat() {
    const name  = document.getElementById('name-input').value.trim();
    const email = document.getElementById('email-input').value.trim();
    if (!name) { document.getElementById('name-input').focus(); return; }

    userName  = name;
    userEmail = email;
    sessionId = generateId();

    localStorage.setItem('sunny_name',    userName);
    localStorage.setItem('sunny_email',   userEmail);
    localStorage.setItem('sunny_session', sessionId);

    document.getElementById('name-modal').classList.add('hidden');
    addMessage('bot', '🌈 Ciao ' + userName + '! Sono l\'assistente di Sunny on the Rainbow. Posso aiutarti a prenotare una festa, una serata pizzata o rispondere a qualsiasi domanda. Come posso aiutarti?');
    focusInput();
  }

  // ── MESSAGGI ──────────────────────────────────────────────────
  function addMessage(type, text) {
    const msgs = document.getElementById('chat-messages');
    const div  = document.createElement('div');
    div.className = 'msg ' + type;
    div.textContent = text;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  function showTyping() {
    const msgs = document.getElementById('chat-messages');
    const div  = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing-indicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  // ── INVIO ─────────────────────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text  = input.value.trim();
    if (!text || !userName) return;

    input.value = '';
    autoResize(input);

    addMessage('user', text);
    document.getElementById('send-btn').disabled = true;
    showTyping();

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: sessionId,
          message:    text,
          name:       userName,
          email:      userEmail,
          tipo:       'chat'
        })
      });

      removeTyping();

      if (!response.ok) throw new Error('HTTP ' + response.status);

      const data = await response.json();
      const reply = data.reply || data.output || 'Ho ricevuto il tuo messaggio!';

      // Aggiorna session_id se il server ne restituisce uno nuovo
      if (data.session_id) {
        sessionId = data.session_id;
        localStorage.setItem('sunny_session', sessionId);
      }

      addMessage('bot', reply);

    } catch (err) {
      removeTyping();
      addMessage('bot', 'Ops, si è verificato un problema di connessione. Riprova tra un momento!');
      console.error('Chat error:', err);
    } finally {
      document.getElementById('send-btn').disabled = false;
      focusInput();
    }
  }

  // ── HELPERS ───────────────────────────────────────────────────
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function focusInput() {
    document.getElementById('user-input').focus();
  }
</script>
</body>
</html>
